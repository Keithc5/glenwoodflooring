<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }}</title>
    <link rel="icon" href="image/favicon.ico" type="image/x-icon" />
    <meta name="Keywords" content="Wooden Floor, Wooden Floor Sales, Floor restoration, Floor fitting" />
    <meta name="Description" content="Wooden Floor Sales and Restoration. Wooden Floor Fitting." />
    <meta name="google-site-verification" content="X4RrsNTgxi-zJ6JSc43qr_p3dLuY7ok9HEbfL8pOlSU" />
    <link rel="stylesheet" href="css/style.css" type="text/css" />
    <link rel="stylesheet" href="css/skin.css" type="text/css" />
    {% if page.nivo_slider %}
    <link rel="stylesheet" href="css/nivo-slider.css" type="text/css" />
    {% endif %}
    <script src="js/jquery.min.js" type="text/javascript"></script>
    {% if page.nivo_slider %}
    <script src="js/jquery.nivo.slider.pack.js" type="text/javascript"></script>
    {% endif %}
    <script src="js/jquery.jcarousel.js" type="text/javascript"></script>
    <script type="text/javascript">
        jQuery(function($) {
            {% if page.nivo_slider %}
            $('#procarousel, #mycarousel').jcarousel({
            {% else %}
            $('#mycarousel').jcarousel({
            {% endif %}
                scroll: 1,
                auto: 2,
                wrap: 'circular'
            });
        });
        {% if page.nivo_slider %}
        jQuery(window).load(function() {
            jQuery('#slider').nivoSlider({
                effect: 'random',
                slices: 15,
                boxCols: 8,
                boxRows: 4,
                animSpeed: 2000,
                pauseTime: 5000,
                startSlide: 0,
                directionNav: true,
                controlNav: false,
                controlNavThumbs: false,
                pauseOnHover: true,
                manualAdvance: false,
                prevText: 'Prev',
                nextText: 'Next',
                randomStart: false
            });
        });
        {% endif %}
    </script>
    <script>
        (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
        (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
        m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
        })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
        ga('create', 'UA-399393-68', 'glenwoodflooring.ie');
        ga('send', 'pageview');
    </script>
</head>
<body style="background-image:url(image/patterns.png)">
    <div class="wrapper">
        {% include header.html %}
{{ content }}
        <div class="clear"></div>
        {% include footer.html %}
    </div>
</body>
</html>
